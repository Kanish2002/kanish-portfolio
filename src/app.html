<!doctype html>
<html lang="en" data-theme="emerald"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#10141a"/><script>(()=>{try{const themes=['emerald','ocean','violet','ember','arctic','rose'];const mode=localStorage.getItem('portfolio-theme-mode')||'random';let theme=localStorage.getItem('portfolio-theme')||'emerald';if(mode==='random'){const last=localStorage.getItem('portfolio-last-theme');const choices=themes.filter((item)=>item!==last);theme=choices[Math.floor(Math.random()*choices.length)]||'emerald';localStorage.setItem('portfolio-last-theme',theme)}if(!themes.includes(theme))theme='emerald';document.documentElement.dataset.theme=theme}catch{}})();</script><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>%sveltekit.head%</head><body class="bg-surface font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container"><div style="display:contents">%sveltekit.body%</div></body></html>
